name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest runnable reproduction and exact commands.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hanami version or commit
    validations:
      required: true
  - type: input
    id: go
    attributes:
      label: Go version
      placeholder: go version go1.27.1 linux/amd64
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, and kernel version for Linux security issues. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification attempted
      description: List the commands or scenario already exercised.
